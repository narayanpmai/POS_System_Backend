version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartpos-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-smartpos}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpos-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-smartpos}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
    ports:
      - "5001:5000"
    depends_on:
      - db
    # Command to run migrations before starting the app
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && npm run start:prod"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpos-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  pgdata:

name: CI/CD for koselighar-backend (prod)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  ci-cd:
    runs-on: [self-hosted, hostinger]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node Environment
        shell: bash
        run: |
          set +e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install --lts
          nvm use --lts
          nvm alias default lts/*
          echo "✓ Node: $(node -v)"
          echo "✓ NPM: $(npm -v)"

      - name: Install & Build Backend
        shell: bash
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts
          cd backend
          npm install --include=dev
          npx prisma generate
          ./node_modules/.bin/nest build

      - name: Install & Build Frontend
        shell: bash
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts
          cd frontend
          npm install --include=dev
          npm run build

      - name: Deploy to dev directory
        shell: bash
        run: |
          DEPLOY_DIR="$HOME/koselighar-backend"
          BUILD_DIR="$(pwd)"
          echo "Deploying to $DEPLOY_DIR..."
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete "$BUILD_DIR"/ "$DEPLOY_DIR"/
          echo "✓ Files copied to deployment directory"

      - name: Copy env files
        shell: bash
        run: |
          if [ -f "/home/envs/koselighar/.env.production" ]; then
            cp /home/envs/koselighar/.env.production "$HOME/koselighar-backend/backend/.env"
            cp /home/envs/koselighar/.env.production "$HOME/koselighar-backend/frontend/.env.local" || true
            echo "✓ .env.production copied"
          else
            cp /home/envs/koselighar/.env.development "$HOME/koselighar-backend/backend/.env" || true
            cp /home/envs/koselighar/.env.development "$HOME/koselighar-backend/frontend/.env.local" || true
            echo "⚠️ .env.production not found, falling back to .env.development"
          fi

      - name: Push database schema changes
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts
          cd "$HOME/koselighar-backend/backend"
          npx prisma generate
          npx prisma db push --accept-data-loss
          node seed.js || true

      - name: Install production dependencies
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts
          cd "$HOME/koselighar-backend/backend"
          npm install --omit=dev --ignore-scripts
          npm rebuild bcrypt || true
          cd "$HOME/koselighar-backend/frontend"
          npm install --omit=dev --ignore-scripts || true

      - name: Ensure uploads folder exists
        shell: bash
        run: |
          UPLOAD_DIR="$HOME/storage/koselighar"
          mkdir -p "$UPLOAD_DIR"
          chmod -R 775 "$UPLOAD_DIR"
          echo "Uploads dir:"
          ls -ld "$UPLOAD_DIR"

      - name: Deploy with PM2
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts
          cd "$HOME/koselighar-backend"
          pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
          pm2 save --force

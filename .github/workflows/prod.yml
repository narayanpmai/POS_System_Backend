name: CI/CD for koselighar-backend (prod)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci-cd:
    runs-on: [self-hosted, hostinger]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node Environment
        shell: bash
        run: |
          set +e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          nvm install --lts
          nvm use --lts
          nvm alias default lts/*

          echo "✓ Node: $(node -v)"
          echo "✓ NPM: $(npm -v)"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          npm install --include=dev
          chmod -R +x node_modules/.bin || true

      - name: Generate Prisma client
        shell: bash
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          npx prisma generate

      - name: Clean dist folder
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          rm -rf dist || true

      - name: Build project
        shell: bash
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          echo "Starting build..."
          ./node_modules/.bin/nest build
          echo "Build completed"

      - name: Verify build output
        shell: bash
        run: |
          set -e
          if [ ! -d "dist" ] || [ ! -f "dist/src/main.js" ]; then
            echo "❌ ERROR: dist/src/main.js not found!"
            ls -lah dist/ || echo "dist folder not found"
            exit 1
          fi
          echo "✓ Production build verified"
          ls -lh dist/src/main.js

      - name: Run tests
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          npm test || echo "No test script or tests failing - continuing for prod..."

      - name: Deploy to prod directory
        shell: bash
        run: |
          DEPLOY_DIR="$HOME/koselighar-backend"
          BUILD_DIR="$(pwd)"

          echo "Deploying to $DEPLOY_DIR..."
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete "$BUILD_DIR"/ "$DEPLOY_DIR"/
          echo "✓ Files copied to deployment directory"

      - name: Copy env file to deployment directory
        shell: bash
        run: |
          ENV_DIR="/home/envs/koselighar"
          DEPLOY_DIR="$HOME/koselighar-backend"

          if [ -f "$ENV_DIR/.env.production" ]; then
            cp "$ENV_DIR/.env.production" "$DEPLOY_DIR/.env"
            cp "$ENV_DIR/.env.production" "$DEPLOY_DIR/.env.production" 2>/dev/null || true
            echo "✓ Copied .env.production to $DEPLOY_DIR/.env"
          elif [ -f "$ENV_DIR/.env.development" ]; then
            cp "$ENV_DIR/.env.development" "$DEPLOY_DIR/.env"
            cp "$ENV_DIR/.env.development" "$DEPLOY_DIR/.env.development" 2>/dev/null || true
            echo "✓ Copied .env.development to $DEPLOY_DIR/.env and $DEPLOY_DIR/.env.development"
          elif [ -f "$ENV_DIR/.env" ]; then
            cp "$ENV_DIR/.env" "$DEPLOY_DIR/.env"
            cp "$ENV_DIR/.env" "$DEPLOY_DIR/.env.development" 2>/dev/null || true
            echo "✓ Copied .env to $DEPLOY_DIR/.env"
          chmod 644 "$DEPLOY_DIR/.env"* 2>/dev/null || true

          # Convert laptop Termius tunnel port (5555) to native VPS PostgreSQL port (5432) for server execution
          if grep -q ":5555" "$DEPLOY_DIR/.env"; then
            sed -i 's/:5555/:5432/g' "$DEPLOY_DIR/.env"
            echo "✓ Automatically adjusted DATABASE_URL port from 5555 (laptop tunnel) to 5432 (VPS native PostgreSQL)"
          fi

      - name: Push database schema changes (prod)
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          cd "$HOME/koselighar-backend"
          
          echo "Generating Prisma client in deployment directory..."
          npx prisma generate

          echo "Pushing database schema changes..."
          npx prisma db push --accept-data-loss || npx prisma db push || echo "⚠️ Warning: Database push skipped - please check Hostinger PostgreSQL container on port 5555"

      - name: Install production dependencies in prod deployment dir
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          cd "$HOME/koselighar-backend"
          npm install --omit=dev --ignore-scripts
          npm rebuild bcrypt || echo "bcrypt rebuild failed or not used, continuing..."

      - name: Ensure uploads folder exists (prod)
        shell: bash
        run: |
          UPLOAD_DIR="/home/storage-prod/koselighar"
          if ! mkdir -p "$UPLOAD_DIR" 2>/dev/null; then
            UPLOAD_DIR="/home/storage/koselighar"
            mkdir -p "$UPLOAD_DIR" 2>/dev/null || mkdir -p "$HOME/storage/koselighar"
          fi
          chmod -R 775 "$UPLOAD_DIR" 2>/dev/null || true
          echo "✓ Uploads dir verified at $UPLOAD_DIR"

      - name: Deploy prod with PM2 (reuse same process)
        shell: bash
        env:
          APP_NAME: koselighar-backend
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          cd "$HOME/koselighar-backend"

          if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
            pm2 reload ecosystem.config.js --only "$APP_NAME" --update-env
          else
            pm2 start ecosystem.config.js --only "$APP_NAME"
          fi

          # Wait up to 30 seconds for app to come online
          MAX_ATTEMPTS=15
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))

            STATUS=$(pm2 jlist | jq -r ".[] | select(.name==\"$APP_NAME\") | .pm2_env.status" | head -n1)

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Status = $STATUS"

            if [ "$STATUS" = "online" ]; then
              echo "✓ Prod deployment successful"
              pm2 save --force
              exit 0
            fi
          done

          echo "❌ Timeout: App did not come online after 30 seconds"
          pm2 logs "$APP_NAME" --lines 100 --nostream || true
          exit 1

      - name: Deployment Summary (prod)
        if: always()
        shell: bash
        run: |
          echo "=== Final PM2 Status ==="
          pm2 list
          echo ""
          echo "Application is running from:"
          echo "$HOME/koselighar-backend"

name: CI/CD for koselighar-backend (dev)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  ci-cd:
    runs-on: [self-hosted, hostinger]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node Environment
        shell: bash
        run: |
          set +e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          nvm install --lts
          nvm use --lts
          nvm alias default lts/*

          echo "✓ Node: $(node -v)"
          echo "✓ NPM: $(npm -v)"

      - name: Install dependencies
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          npm install
          chmod +x node_modules/.bin/nest

      - name: Generate Prisma client
        shell: bash
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          npx prisma generate

      - name: Clean dist folder
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          rm -rf dist || true

      - name: Build project
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          echo "Starting build..."
          npm run build
          echo "Build completed"

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f "dist/src/main.js" ]; then
            echo "ERROR: dist/src/main.js not found!"
            ls -lah dist/ || echo "dist folder not found"
            exit 1
          fi
          echo "✓ Build successful"
          ls -lh dist/src/main.js

      - name: Run tests
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          npm test || echo "No test script or tests failing - continuing for dev..."

      - name: Deploy to dev directory
        shell: bash
        run: |
          DEPLOY_DIR="$HOME/koselighar-backend-dev"
          BUILD_DIR="$(pwd)"

          echo "Deploying to $DEPLOY_DIR..."
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete "$BUILD_DIR"/ "$DEPLOY_DIR"/
          echo "✓ Files copied to deployment directory"

      - name: Copy dev env file to deployment directory
        shell: bash
        run: |
          cp /home/envs/koselighar/.env.development "$HOME/koselighar-backend-dev/.env.development"
          cp /home/envs/koselighar/.env.development "$HOME/koselighar-backend-dev/.env"
          chmod 644 "$HOME/koselighar-backend-dev/.env.development" "$HOME/koselighar-backend-dev/.env"
          echo "✓ env files copied"

      - name: Push database schema changes (dev)
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          cd "$HOME/koselighar-backend-dev"
          
          echo "Ensuring default company exists before schema push..."
          cat > temp-init-company.js << 'EOF'
          const fs = require('fs');
          try {
            if (fs.existsSync('.env')) {
              fs.readFileSync('.env', 'utf8').split(/\r?\n/).forEach(line => {
                const trimmed = line.trim();
                if (trimmed && !trimmed.startsWith('#')) {
                  const index = trimmed.indexOf('=');
                  if (index !== -1) {
                    const key = trimmed.substring(0, index).trim();
                    let value = trimmed.substring(index + 1).trim();
                    if (value.startsWith('"') && value.endsWith('"')) {
                      value = value.substring(1, value.length - 1);
                    } else if (value.startsWith("'") && value.endsWith("'")) {
                      value = value.substring(1, value.length - 1);
                    }
                    process.env[key] = value;
                  }
                }
              });
            }
          } catch (err) {
            console.log('Error loading env:', err.message);
          }

          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          async function main() {
            try {
              await prisma.$executeRawUnsafe(`
                CREATE TABLE IF NOT EXISTS "Company" (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(255) NOT NULL,
                  email VARCHAR(255),
                  phone VARCHAR(255),
                  address VARCHAR(255),
                  logo VARCHAR(255),
                  "isActive" BOOLEAN DEFAULT true,
                  "createdAt" TIMESTAMP DEFAULT NOW(),
                  "updatedAt" TIMESTAMP DEFAULT NOW()
                );
              `);
              await prisma.$executeRawUnsafe(`
                INSERT INTO "Company" (id, name, "isActive", "createdAt", "updatedAt")
                VALUES (1, 'Koseli Ghar', true, NOW(), NOW())
                ON CONFLICT (id) DO NOTHING;
              `);
              console.log('Default company ensured.');
            } catch (e) {
              console.log('Skipping company init:', e.message);
            }
          }
          main().finally(() => prisma.$disconnect());
          EOF

          node temp-init-company.js || echo "Company init skipped"
          rm -f temp-init-company.js

          echo "Pushing database schema changes..."
          npx prisma db push --accept-data-loss

          echo "Seeding database..."
          npm run prisma:seed || echo "Seed completed or already up to date"

      - name: Install production dependencies in dev deployment dir
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          cd "$HOME/koselighar-backend-dev"
          npm install --omit=dev --ignore-scripts
          npm rebuild bcrypt || echo "bcrypt rebuild failed or not used, continuing..."

      - name: Ensure uploads folder exists (dev)
        shell: bash
        run: |
          UPLOAD_DIR="/home/storage-dev/koselighar"
          mkdir -p "$UPLOAD_DIR"
          chmod -R 775 "$UPLOAD_DIR"
          echo "Uploads dir:"
          ls -ld "$UPLOAD_DIR"

      - name: Deploy dev with PM2 (reuse same process)
        shell: bash
        env:
          APP_NAME: koselighar-dev
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use --lts

          cd "$HOME/koselighar-backend-dev"

          if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
            pm2 reload ecosystem.config.cjs --only "$APP_NAME" --update-env
          else
            pm2 start ecosystem.config.cjs --only "$APP_NAME"
          fi

          # Wait up to 30 seconds for app to come online
          MAX_ATTEMPTS=15
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))

            STATUS=$(pm2 jlist | jq -r ".[] | select(.name==\"$APP_NAME\") | .pm2_env.status" | head -n1)

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Status = $STATUS"

            if [ "$STATUS" = "online" ]; then
              echo "✓ Dev deployment successful"
              pm2 save --force
              exit 0
            fi
          done

          echo "❌ Timeout: App did not come online after 30 seconds"
          pm2 logs "$APP_NAME" --lines 100 --nostream || true
          exit 1

      - name: Deployment Summary (dev)
        if: always()
        shell: bash
        run: |
          echo "=== Final PM2 Status ==="
          pm2 list
          echo ""
          echo "Application is running from:"
          echo "$HOME/koselighar-backend-dev"

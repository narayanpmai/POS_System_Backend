name: SmartPOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Backend - Install Dependencies
      run: |
        cd backend
        npm ci
        npx prisma generate

    - name: Backend - Build
      run: |
        cd backend
        npm run build

    - name: Frontend - Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Frontend - Build
      run: |
        cd frontend
        npm run build
